<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 1 - Form Registrasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-brands fa-js"></i>
      Latihan JavaScript
    </a>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="latihan-1.html" class="aktif">Latihan 1</a>
      <a href="latihan-2.html">Latihan 2</a>
      <a href="latihan-3.html">Latihan 3</a>
      <a href="latihan-4.html">Latihan 4</a>
    </nav>
  </header>

  <main>

    <div class="judul-halaman">
      <h1>Form Registrasi Mahasiswa</h1>
      <p>Ketik beberapa huruf pada kolom nama, rekomendasi nama akan muncul di bawahnya.</p>
    </div>

    <div id="berhasil" class="berhasil" hidden></div>

    <section class="kartu">
      <h2>Data Registrasi</h2>
      <form id="form-registrasi" novalidate>
        <div class="field">
          <label for="nama">Nama Mahasiswa</label>
          <div class="saran-wadah">
            <input type="text" id="nama" placeholder="Ketik nama, contoh: An" autocomplete="off">
            <ul id="saran-nama" class="saran" hidden></ul>
          </div>
        </div>
        <div class="field">
          <label for="nim">NIM</label>
          <input type="text" id="nim" placeholder="Contoh: 2405001" inputmode="numeric">
        </div>
        <div class="baris">
          <div class="field">
            <label for="matkul">Mata Kuliah</label>
            <select id="matkul">
              <option value="">-- Pilih mata kuliah --</option>
              <option>Pemrograman Web</option>
              <option>Basis Data</option>
              <option>Pemrograman Berorientasi Objek</option>
              <option>Struktur Data</option>
              <option>Jaringan Komputer</option>
              <option>Teori Graf</option>
            </select>
          </div>
          <div class="field">
            <label for="dosen">Dosen</label>
            <select id="dosen">
              <option value="">-- Pilih dosen --</option>
              <option>Dr. Andi Wijaya, S.Kom., M.Kom.</option>
              <option>Bambang Sutrisno, S.T., M.T.</option>
              <option>Dewi Lestari, S.Kom., M.Kom.</option>
              <option>Hendra Gunawan, S.Kom., M.Cs.</option>
              <option>Ratna Sari, S.Si., M.Kom.</option>
            </select>
          </div>
        </div>
        <div class="tombol-grup">
          <button type="submit" class="tombol simpan"><i class="fa-solid fa-paper-plane"></i> Daftar</button>
          <button type="reset" class="tombol reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        </div>
      </form>
    </section>

  </main>

  <script src="latihan-1.js"></script>
</body>
</html>
