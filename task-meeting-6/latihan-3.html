<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 3 - Formulir Pendaftaran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-brands fa-js"></i>
      Latihan JavaScript
    </a>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="latihan-1.html">Latihan 1</a>
      <a href="latihan-2.html">Latihan 2</a>
      <a href="latihan-3.html" class="aktif">Latihan 3</a>
      <a href="latihan-4.html">Latihan 4</a>
    </nav>
  </header>

  <main>

    <div class="judul-halaman">
      <h1>Formulir Pendaftaran</h1>
      <p>Isi semua data di bawah ini. Setiap kolom akan diperiksa sebelum formulir dikirim.</p>
    </div>

    <div id="berhasil" class="berhasil" hidden></div>

    <section class="kartu">
      <h2>Data Pendaftar</h2>
      <form id="form-pendaftaran" novalidate>
        <div class="field">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Masukkan nama lengkap">
        </div>
        <div class="field">
          <label for="alamat">Alamat</label>
          <input type="text" id="alamat" placeholder="Masukkan alamat">
        </div>
        <div class="baris">
          <div class="field">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" placeholder="nama@domain.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimal 8 karakter">
          </div>
        </div>
        <div class="field">
          <label for="prodi">Program Studi</label>
          <select id="prodi">
            <option value="">-- Pilih program studi --</option>
            <option>Informatika</option>
            <option>Sistem Informasi</option>
            <option>Teknik Komputer</option>
            <option>Manajemen</option>
            <option>Akuntansi</option>
          </select>
        </div>
        <div class="field">
          <label for="kampus">Nama Kampus</label>
          <textarea id="kampus" rows="2" placeholder="Masukkan nama kampus"></textarea>
        </div>
        <div class="field">
          <label class="centang">
            <input type="checkbox" id="setuju">
            Saya menyatakan data di atas sudah benar
          </label>
        </div>
        <div class="tombol-grup">
          <button type="submit" class="tombol simpan"><i class="fa-solid fa-paper-plane"></i> Kirim</button>
          <button type="reset" class="tombol reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        </div>
      </form>
    </section>

  </main>

  <script src="latihan-3.js"></script>
</body>
</html>
