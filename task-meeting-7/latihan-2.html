<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 2 - Halaman Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row vh-100">

      <!-- Panel kiri -->
      <div class="col-6 bg-primary text-white d-flex flex-column justify-content-center align-items-center text-center">
        <i class="bi bi-bootstrap-fill display-1"></i>
        <h1 class="fw-bold mt-3">Belajar Bootstrap</h1>
        <p class="lead">Latihan membuat halaman login dengan Bootstrap.</p>
      </div>

      <!-- Form login -->
      <div class="col-6 d-flex align-items-center">
        <div class="w-75 mx-auto px-5">
          <a href="index.html" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Kembali ke Beranda</a>

          <h2 class="fw-light mt-4 mb-4">Selamat datang kembali!</h2>

          <form action="#">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="ingat">
              <label class="form-check-label" for="ingat">Ingat saya</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 text-uppercase fw-bold">Masuk</button>
          </form>

          <div class="text-center mt-3">
            <a href="#" class="small">Lupa password?</a>
            <p class="small mt-2">Belum punya akun? <a href="#">Daftar</a></p>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
